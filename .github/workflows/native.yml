name: Windows SMTC

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: 构建 Windows x64 Node-API v8 产物
        run: npm run package:native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smtc-win32-x64
          path: prebuilds/win32-x64/*.node
          if-no-files-found: error

  verify:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    env:
      PREBUILDS_ONLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: smtc-win32-x64
          path: prebuilds/win32-x64
      - name: 原生加载、启停、GC 与 Worker 退出
        run: npm run test:native
      - name: 无编译工具参与的发布包安装验证
        run: npm run test:package:native
      - name: 确认测试进程与端口已释放
        if: always()
        shell: pwsh
        run: |
          $projectNodes = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.CommandLine -like "*$env:GITHUB_WORKSPACE*" })
          $listeners = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.OwningProcess -in @($projectNodes.ProcessId) })
          $projectNodes | Select-Object ProcessId, CommandLine
          $listeners | Select-Object LocalAddress, LocalPort, OwningProcess
          if ($projectNodes.Count) {
            $projectNodes | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            throw '原生测试留下了 Node.js 进程'
          }
