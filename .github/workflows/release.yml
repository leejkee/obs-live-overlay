name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出标签
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: 校验标签与包版本
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::发布标签必须使用 vX.Y.Z 格式，当前为 ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 package.json 版本 ${expected_tag} 不一致"
            exit 1
          fi

      - name: 安装依赖
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 校验、测试并构建
        run: npm run verify

      - name: 生成并验证发布产物
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          package_name="leejkee-obs-live-overlay-${package_version}.tgz"
          mkdir release
          npm pack --pack-destination release
          test -f "release/${package_name}"
          (
            cd release
            sha256sum "${package_name}" > "${package_name}.sha256"
          )
          npm install --global "./release/${package_name}" --prefix "${RUNNER_TEMP}/obs-live-overlay-smoke"
          actual_version="$("${RUNNER_TEMP}/obs-live-overlay-smoke/bin/obs-live-overlay" --version)"
          test "${actual_version}" = "${package_version}"

      - name: 创建 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_version="$(node --print "require('./package.json').version")"
          release_args=(
            "${GITHUB_REF_NAME}"
            "release/leejkee-obs-live-overlay-${package_version}.tgz"
            "release/leejkee-obs-live-overlay-${package_version}.tgz.sha256"
            --verify-tag
            --generate-notes
            --title "${GITHUB_REF_NAME}"
          )
          if [[ "${package_version}" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "${release_args[@]}"
