<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>直播叠加层控制台</title>
    <link rel="stylesheet" href="/control.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">◫</span>
          <div><strong>Live Overlay</strong><small>OBS 控制台</small></div>
        </div>
        <nav aria-label="叠加层列表">
          <p class="nav-label">叠加层</p>
          <button class="nav-item active" type="button">
            <span class="live-dot"></span><span>等候队列</span><span id="nav-count" class="nav-count">0</span>
          </button>
        </nav>
        <div class="sidebar-foot">
          <span id="connection-dot" class="connection-dot"></span>
          <span id="connection-label">正在连接服务</span>
        </div>
      </aside>

      <main>
        <header class="page-header">
          <div>
            <p class="eyebrow">QUEUE OVERLAY</p>
            <h1>等候队列</h1>
            <p class="subtitle">输入 ID 加入队列，队首会自动成为当前观众</p>
          </div>
          <a class="preview-link" href="/overlay/queue" target="_blank" rel="noreferrer">打开 Overlay ↗</a>
        </header>

        <section class="profile-control" aria-labelledby="profile-heading">
          <div>
            <h2 id="profile-heading">Queue Profile</h2>
            <p>选择要加载到 Queue Overlay 的独立配置</p>
          </div>
          <div class="profile-actions">
            <label class="sr-only" for="profile-select">当前 Profile</label>
            <select id="profile-select" aria-label="当前 Profile"></select>
            <button id="create-profile-button" class="secondary-button" type="button">新建</button>
            <button id="rename-profile-button" class="secondary-button" type="button">重命名</button>
            <button id="delete-profile-button" class="danger-button" type="button">删除</button>
          </div>
        </section>

        <section class="add-card" aria-labelledby="add-heading">
          <div>
            <h2 id="add-heading">加入排队</h2>
            <p>输入观众 ID 并加入队尾</p>
          </div>
          <form id="add-form">
            <label class="sr-only" for="viewer-id">观众 ID</label>
            <input id="viewer-id" name="id" maxlength="80" autocomplete="off" placeholder="输入观众 ID" required />
            <button class="primary-button" type="submit">加入队列</button>
          </form>
        </section>

        <section class="message-control" aria-labelledby="message-heading">
          <div>
            <h2 id="message-heading">Overlay 消息</h2>
            <p>显示在“等候队列”标题下方，留空时自动隐藏</p>
          </div>
          <form id="message-form">
            <label class="sr-only" for="overlay-message-input">Overlay 消息内容</label>
            <input id="overlay-message-input" name="message" maxlength="120" autocomplete="off" placeholder="输入消息内容" />
            <button class="primary-button" type="submit">保存消息</button>
            <button id="clear-message-button" class="secondary-button" type="button">清空</button>
          </form>
        </section>

        <section class="stop-control" aria-labelledby="stop-heading">
          <div>
            <h2 id="stop-heading">“不排了”提示</h2>
            <p>开启后，Overlay 标题右侧会显示“不排了”</p>
          </div>
          <button id="stop-toggle" class="toggle-button" type="button" role="switch" aria-checked="false">
            <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
            <span id="stop-toggle-label">已关闭</span>
          </button>
        </section>

        <section class="queue-section" aria-labelledby="queue-heading">
          <div class="section-heading">
            <div>
              <h2 id="queue-heading">当前队列</h2>
              <p><span id="queue-count">0</span> 位观众正在等待</p>
            </div>
            <button id="dequeue-button" class="secondary-button" type="button">当前观众出队</button>
          </div>

          <div id="empty-state" class="empty-state">
            <span class="empty-icon" aria-hidden="true">◇</span>
            <h3>队列还是空的</h3>
            <p>从上方输入第一个观众 ID 吧</p>
          </div>
          <ol id="queue-list" class="queue-list" aria-live="polite"></ol>
        </section>
      </main>
    </div>
    <div id="toast-region" class="toast-region" aria-live="assertive"></div>
    <script type="module" src="/control.js"></script>
  </body>
</html>
