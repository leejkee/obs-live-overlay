<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音乐控制台 · OBS Live Overlay</title><link rel="stylesheet" href="/control.css"><link rel="stylesheet" href="/music-control.css"></head>
<body>
<div class="music-console">
<header class="console-header"><div><span class="section-kicker">OBS LIVE OVERLAY</span><h1>音乐控制台</h1><p>配置直播画面中的音乐信息，在播放器中播放和切歌。</p></div><a class="preview-link" href="/overlay/music" target="_blank" rel="noreferrer">打开音乐 Overlay ↗</a></header>
<div id="notice" role="status" aria-live="polite">正在连接音乐服务…</div>
<section class="console-card master"><div><h2>音乐 Overlay</h2><p>关闭后停止音乐监控并隐藏画面，控制台仍可使用。</p><p id="runtime-status">正在读取状态</p></div><label class="toggle"><input id="enabled" type="checkbox" role="switch" disabled><span>启用音乐服务</span></label></section>
<div class="console-grid"><section class="console-card"><div class="card-heading"><h2>显示模块</h2><span>独立开关 · 自动保存</span></div><p class="muted">关闭全部模块时，整个音乐卡片也会隐藏。</p>
<div class="module-row"><label class="toggle"><input type="checkbox" data-module="cover" role="switch" disabled><span>歌曲封面</span></label></div>
<div class="module-row"><label class="toggle"><input type="checkbox" data-module="status" role="switch" disabled><span>播放状态</span></label></div>
<div class="module-row"><label class="toggle"><input type="checkbox" data-module="title" role="switch" disabled><span>歌曲名称</span></label><button type="button" data-style="title" disabled>编辑字体</button></div>
<div class="module-row"><label class="toggle"><input type="checkbox" data-module="artistTitle" role="switch" disabled><span>歌手名称 - 歌曲名称</span></label><button type="button" data-style="artistTitle" disabled>编辑字体</button></div>
</section>
<section class="console-card preview-card"><div class="card-heading"><h2>实时预览</h2><span>与 OBS 同步</span></div><div class="preview-surface"><iframe src="/overlay/music" title="音乐 Overlay 实时预览"></iframe></div><p class="muted">OBS 浏览器源地址</p><code id="overlay-url"></code><p class="muted">建议尺寸 660 × 210；较大字号请增加浏览器源高度。</p></section></div>
</div>
<dialog id="style-dialog" class="style-dialog" aria-labelledby="style-heading"><div class="style-panel"><div class="style-panel-header"><div><span class="section-kicker">字体编辑器</span><h2 id="style-heading">字体样式</h2><p id="style-label"></p></div><button id="close-style" class="dialog-close-button" type="button" aria-label="关闭字体样式编辑器">×</button></div><div id="typography-editor" class="typography-editor"></div><p class="style-panel-tip">修改后自动保存，并同步到音乐 Overlay。</p></div></dialog>
<script type="module" src="/music-control.js"></script>
</body></html>
